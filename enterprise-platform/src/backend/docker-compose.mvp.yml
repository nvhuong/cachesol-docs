# =====================================================================
# cachesol-platform MVP docker-compose
#
# Port map (avoid conflict with local services):
#   postgres       → host 5433 (internal 5432)
#   keycloak       → host 8090 (internal 8080)
#   kafka          → host 9092 (internal 9092)
#   iam            → host 8088 (internal 8082)
#   platform-reg   → host 8087 (internal 8081)
#   tenant-mgr     → host 8089 (internal 8083)
#
# Usage:
#   docker compose -f docker-compose.mvp.yml up -d --build
#   docker compose -f docker-compose.mvp.yml logs -f [service-name]
# =====================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: cachesol_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cachesol_platform"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres-init:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: postgres
    volumes:
      - ./init-postgres.sh:/init-postgres.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["sh /init-postgres.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # Keycloak 24 có bootstrap admin flow. CẦN set CẢ HAI naming conventions:
    #   - KC_BOOTSTRAP_ADMIN_USERNAME / KC_BOOTSTRAP_ADMIN_PASSWORD  (env chuẩn)
    #   - KEYCLOAK_ADMIN / KEYCLOAK_ADMIN_PASSWORD                  (env legacy được honors)
    # Nếu thiếu 1 trong 2, log "Added user 'admin' to realm 'master'" KHÔNG xuất hiện.
    command: ["start-dev"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_BOOTSTRAP_ADMIN_USER_ENABLED: "true"
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_PORT: 8080
      KC_HOSTNAME_STRICT: "false"
      KC_HEALTH_ENABLED: "true"
    # Custom Keycloak login themes per tenant (via realm's `loginTheme` field).
    # Each theme directory must contain a `login/` subdirectory with theme files.
    # Structure: ./keycloak/themes/<theme-name>/login/{theme.properties,login.ftl,resources/...}
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes:ro
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 && echo -e 'GET /realms/master HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s

  keycloak-init:
    image: alpine/curl:latest
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      # Dùng đúng tên env mà init-keycloak.sh đọc (KEYCLOAK_ADMIN_USER, không phải KEYCLOAK_ADMIN)
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_REALM: cachesol
    volumes:
      - ./init-keycloak.sh:/init-keycloak.sh:ro
    entrypoint: ["/bin/sh", "-c"]
    command: ["apk add --no-cache jq bash wget && /init-keycloak.sh"]
    restart: "no"

  # ── Kafka (KRaft mode — không cần Zookeeper) ────────────────────────────
  # Dùng cho event bus giữa platform-registry ↔ tenant-manager.
  # KRaft mode: 1 process vừa là controller vừa là broker (dev only).
  kafka:
    image: apache/kafka:3.8.1
    environment:
      # KRaft single-node
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      CLUSTER_ID: "cachesol-mvp-cluster-abcdef1234"
    ports:
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  # ── Spring Boot services ────────────────────────────────────────────────
  # All services wait for postgres to be healthy, plus service-level
  # ordering: platform-reg → tenant-manager (tenant-manager calls platform-reg).

  iam-service:
    build:
      context: .
      dockerfile: platform/iam/Dockerfile
      args:
        SERVICE_PATH: platform/iam
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: cachesol
      KEYCLOAK_ADMIN_USER: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KEYCLOAK_ADMIN_CLIENT: admin-cli
      KEYCLOAK_ADMIN_SECRET: admin-cli-secret
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cachesol_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8082
      # Kafka event bus (IAM publishes keycloak events)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8088:8082"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  platform-registry-service:
    build:
      context: .
      dockerfile: platform/platform-registry/Dockerfile
      args:
        SERVICE_PATH: platform/platform-registry
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cachesol_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8081
      # IAM service URL for Keycloak realm provisioning
      IAM_URL: http://iam-service:8082
      KEYCLOAK_URL: http://keycloak:8080
      # Kafka event bus
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8087:8081"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      iam-service:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy

  tenant-manager-service:
    build:
      context: .
      dockerfile: platform/tenant-manager/Dockerfile
      args:
        SERVICE_PATH: platform/tenant-manager
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/cachesol_platform
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SERVER_PORT: 8083
      # platform-registry service URL for internal init-schema
      PLATFORM_REGISTRY_URL: http://platform-registry-service:8081
      PLATFORM_REGISTRY_CALLBACK_URL: http://platform-registry-service:8081
      # IAM service URL for Keycloak user CRUD
      IAM_URL: http://iam-service:8082
      # Kafka event bus (consumer side)
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Shared DB with platform-registry: skip flyway checksum validation
      # (tenant-manager's V1/V2 collide with platform-registry's seed migrations
      #  on the same `public` schema; only metadata differs).
      SPRING_FLYWAY_VALIDATE_ON_MIGRATE: "false"
    ports:
      - "8089:8083"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-init:
        condition: service_completed_successfully
      platform-registry-service:
        condition: service_started
      iam-service:
        condition: service_started
      keycloak:
        condition: service_healthy
      kafka:
        condition: service_healthy

volumes:
  pgdata:
