# CacheSol Service Registry — v3 (Multi-tenant, tối giản platform)
# File này là Source of Truth cho CI/CD, deployment, observability tooling.
# Cập nhật khi thêm/xoá service.

services:

  # ===== INFRASTRUCTURE (chạy riêng, không phải Java app) =====
  - id: keycloak
    name: 'Keycloak (Identity Provider)'
    domain: infrastructure
    type: container
    description: 'Source of Truth cho identity. Login/register/LDAP/SSO/OAuth2/MFA.'
    technology: 'Keycloak 24+'
    database: PostgreSQL (cachesol_platform/public)
    port: 8080
    dependencies: [postgres]
    notes:
      - '1 realm cachesol (ban đầu). Có thể split per-tenant khi > 50 tenants.'

  - id: postgres
    name: 'PostgreSQL (multi-schema, schema-per-tenant)'
    domain: infrastructure
    type: container
    description: 'Cachesol_platform DB. 1 schema public (registry + Keycloak) + N schemas tenant_<slug>.'
    technology: 'PostgreSQL 16 + ltree extension'
    port: 5432
    notes:
      - 'Schema-per-tenant: cô lập dữ liệu giữa các công ty.'
      - 'See governance/architecture/multi-tenant.md.'

  - id: kafka
    name: 'Apache Kafka'
    domain: infrastructure
    type: container
    description: 'Event bus giữa các service.'
    technology: 'Apache Kafka 3.7+'
    port: 9092

  - id: api-gateway
    name: 'API Gateway'
    domain: infrastructure
    type: service
    description: 'Tenant resolution (Host/X-Tenant-Id), JWT verify, rate limit, CORS.'
    technology: 'Spring Cloud Gateway hoặc Kong'
    port: 80
    dependencies: [keycloak, iam-service]
    notes:
      - 'Subdomain acme.platform.com → tenant_id=acme.'
      - 'JWT verify ngay tại gateway (cache Keycloak JWK 1h).'

  # ===== PLATFORM SERVICES (CHỈ 8) =====
  - id: iam-service
    name: 'IAM Service (Keycloak JWT Verifier)'
    domain: platform
    description: 'Verify JWT do Keycloak phát hành (JWK cache, 1h TTL). Nhận Keycloak webhook events. KHÔNG có user/role CRUD.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: public — chỉ keycloak_webhook_events audit)
    port: 8081
    api-prefix: '/integration-api/v1, /public-api/v1'
    events-published: []
    events-consumed: []
    dependencies: [keycloak, postgres]
    notes:
      - 'IAM service CHỈ verify JWT, không có user CRUD.'
      - 'User/role CRUD do tenant-manager service đảm nhiệm.'
      - 'See src/backend/platform/iam/README.md.'

  - id: platform-registry-service
    name: 'Platform Registry Service'
    domain: platform
    description: 'Quản lý tenants registry (cross-tenant metadata), mini-apps catalog + per-tenant enable, org-root mapping, role/permission template.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: public + tenant_<slug>_platformregistry)
    port: 8082
    api-prefix: '/client-api/v1, /service-api/v1, /public-api/v1'
    events-published: ['TenantCreated', 'TenantActivated', 'TenantSuspended', 'TenantOffboarded', 'MiniAppEnabled', 'MiniAppDisabled']
    events-consumed: []
    dependencies: [keycloak, postgres, kafka]
    notes:
      - '4 bounded contexts: tenants, mini-apps, org-root mapping, role template.'
      - 'See src/backend/platform/platform-registry/README.md.'

  - id: tenant-manager-service
    name: 'Tenant Manager Service'
    domain: platform
    description: 'Quản lý users (CRUD qua Keycloak Admin API), roles, permissions, user_app_roles, TOÀN BỘ cây tổ chức (organizations/job_titles/employees/employee_assignments). Per-tenant schema.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: tenant_<slug>_tenantmanager)
    port: 8083
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['UserCreated', 'UserDeactivated', 'UserRoleGranted', 'UserRoleRevoked', 'RoleCreated', 'OrganizationCreated', 'OrganizationMoved', 'EmployeeCreated', 'EmployeeAssigned']
    events-consumed: []
    dependencies: [keycloak, platform-registry-service, kafka]
    notes:
      - '5 bounded contexts: users, roles/permissions, organizations, job_titles, employees.'
      - 'HRM đọc org/employee qua service-api này.'
      - 'Role snapshot clone từ platform-registry khi tenant khởi tạo.'
      - 'See src/backend/platform/tenant-manager/README.md.'

  - id: feature-flag-service
    name: 'Feature Flag Service (FF4j self-host)'
    domain: platform
    description: 'Centralized feature toggle engine. Dựa trên FF4j (Feature Flipping for Java) open-source — self-host từ GitHub source (KHÔNG dùng Maven Central). Bao gồm FF4j core engine + WebConsole + REST API + PostgreSQL store. Scope CHỈ feature flags (system params / tenant config đã gộp vào tenant-manager hoặc env vars).'
    technology: 'Spring Boot 21 + FF4j (self-built from github.com/ff4j/ff4j)'
    database: PostgreSQL (schema: ff4j — FF4j native schema) + Redis cache (optional)
    port: 8084
    api-prefix: '/client-api/v1, /service-api/v1, /api/ff4j/* (FF4j native), /ff4j-web-console'
    events-published: ['FeatureFlagChanged', 'FeatureFlagStrategyChanged', 'FeatureFlagPropertyChanged']
    events-consumed: []
    dependencies: [postgres, redis, keycloak]
    notes:
      - '4 bounded contexts: features, properties, flipping strategies, audit.'
      - 'Schema FF4j gốc (KHÔNG custom): ff4j_features, ff4j_properties, ff4j_roles, ff4j_groups, ff4j_audit.'
      - 'Naming convention: <GLOBAL|TENANT_<slug>>.<module>.<feature_name>.'
      - 'WebConsole auth: role=PLATFORM_ADMIN, internal network only.'
      - 'See src/backend/platform/feature-flag/README.md.'

  - id: master-data-service
    name: 'Master Data Service'
    domain: platform
    description: 'Danh mục dùng chung: country, currency, unit, payment-terms, tax-codes...'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: public) + Redis cache
    port: 8085
    api-prefix: '/client-api/v1, /service-api/v1, /public-api/v1'
    events-published: ['MasterDataUpdated']
    events-consumed: []
    dependencies: [postgres]

  - id: social-integration-service
    name: 'Social Integration Service'
    domain: platform
    description: 'Tích hợp đa kênh: notifications (email/SMS/push/in-app), social channels (Facebook/Instagram/LinkedIn/Slack/Telegram/YouTube/Zalo/X/Threads/Viber), posts publishing + engagement, pages management, analytics.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: public + tenant_<slug>_socialintegration)
    port: 8086
    api-prefix: '/client-api/v1, /service-api/v1, /integration-api/v1, /public-api/v1'
    events-published: ['NotificationSent', 'NotificationFailed', 'PostPublished', 'PostFailed', 'ChannelConnected', 'ChannelError']
    events-consumed: ['*']
    dependencies: [postgres, kafka]
    notes:
      - '5 bounded contexts: notifications, channels, posts, pages, analytics.'
      - 'Supported platforms: Firebase, Gmail, Facebook, Instagram, LinkedIn, Slack, Telegram, YouTube, Zalo, X, Threads, Viber, SMS (Twilio/VNFPT).'
      - 'See src/backend/platform/social-integration/README.md.'

  - id: workflow-service
    name: 'Workflow Service (BPMN-lite)'
    domain: platform
    description: 'BPMN-lite engine cho orchestrate quy trình nghiệp vụ. Hỗ trợ BPMN 2.0 cơ bản (start/end/task/gateway/timer) + 5 platform-specific items: Approval Task (gọi approval-service), Notification Task (gọi social-integration), Feature Flag Gate (gọi feature-flag), Entity CRUD Task, Webhook Task. 5 template mặc định seed qua Liquibase: LEAVE_REQUEST, ORDER_DISCOUNT, ONBOARDING, REIMBURSEMENT, RESIGNATION. Custom engine (không Camunda/Flowable) cho nhẹ + tích hợp sâu với platform.'
    technology: 'Spring Boot 21 + Custom BPMN-lite engine'
    database: PostgreSQL (schema: public + tenant_<slug>_workflow)
    port: 8087
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['ProcessStarted', 'ProcessActivityStarted', 'ProcessActivityCompleted', 'ProcessActivityFailed', 'ProcessCompleted', 'ProcessFailed', 'ProcessSuspended', 'ProcessResumed', 'ProcessTerminated', 'UserTaskCreated', 'TimerScheduled', 'TimerFired']
    events-consumed: ['ApprovalApproved', 'ApprovalRejected', 'ApprovalCancelled', 'FeatureFlagChanged']
    dependencies: [postgres, redis, kafka, approval-service, social-integration-service, feature-flag-service, tenant-manager-service]
    notes:
      - '7 bounded contexts: definitions (templates + per-tenant), instances, execution_logs, user_tasks, service_tasks, timers.'
      - '5 templates mặc định (Liquibase seed ở schema public).'
      - 'BPMN XML namespace cachesol dùng: ##cachesol-platform:{approvalRequest, notification, featureFlagCheck, entityCRUD, webhook}.'
      - 'User Task LUÔN delegate sang approval-service.'
      - 'See src/backend/platform/workflow/README.md.'

  - id: approval-service
    name: 'Approval Service'
    domain: platform
    description: 'Phê duyệt tập trung. Hỗ trợ sequential/parallel/mixed (nested). 6 BC: approval_types, approval_type_callbacks, approval_requests, approval_steps, approval_histories, approval_callbacks. Khi request FINAL APPROVED → fire callback config (service-api URL) tới service nghiệp vụ (HMAC-signed, retry với backoff). Approver rule engine: DIRECT_MANAGER, ROLE_X, DYNAMIC_EXPRESSION, ... resolve qua tenant-manager.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: public + tenant_<slug>_approval)
    port: 8088
    api-prefix: '/client-api/v1, /service-api/v1, /public-api/v1'
    events-published: ['ApprovalRequested', 'ApprovalStepActivated', 'ApprovalStepApproved', 'ApprovalStepRejected', 'ApprovalApproved', 'ApprovalRejected', 'ApprovalCancelled', 'ApprovalExpired', 'ApprovalCallbackRequested', 'ApprovalCallbackSucceeded', 'ApprovalCallbackFailed', 'ApprovalCallbackExhausted']
    events-consumed: ['UserTaskCreated']
    dependencies: [keycloak, tenant-manager-service, workflow-service, social-integration-service, kafka]
    notes:
      - '6 bounded contexts: approval_types, type_callbacks, requests, steps, histories, callbacks.'
      - 'Steps definition = JSONB tree (single/parallel/sequential nested).'
      - 'Parallel rule per step: any/all/quorum.'
      - 'Callback HMAC-SHA256 signed, retry max 5 với backoff [1s,5s,30s,1m,5m].'
      - 'See src/backend/platform/approval/README.md.'

  # ===== APPLICATIONS (nghiệp vụ) =====
  - id: hrm-service
    name: 'HRM Service'
    domain: hrm
    description: 'HR nghiệp vụ (attendance, leave, payroll, recruitment, performance, training). KHÔNG quản lý org/employee — đọc qua tenant-manager service-api.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: tenant_<slug>_hrm)
    port: 8090
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['LeaveRequested', 'LeaveApproved', 'PayrollProcessed']
    events-consumed: ['UserCreated', 'UserDeactivated', 'OrganizationMoved', 'EmployeeAssigned']
    dependencies: [tenant-manager-service, workflow-service, approval-service]

  - id: sales-service
    name: 'Sales Service'
    domain: sales
    description: 'CRM mini: customers, contacts, opportunities, orders, invoices. Chứa customer (trước là platform).'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: tenant_<slug>_sales)
    port: 8091
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['CustomerCreated', 'OrderCreated', 'InvoiceCreated']
    events-consumed: ['EmployeeTransferred']
    dependencies: [tenant-manager-service, master-data-service]

  - id: erp-service
    name: 'ERP Service'
    domain: erp
    description: 'Inventory, procurement, production, fixed-assets.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: tenant_<slug>_erp)
    port: 8092
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['StockUpdated', 'LowStockAlert', 'ProductionOrderCompleted']
    events-consumed: ['OrderCreated', 'PurchaseOrderCreated']
    dependencies: [master-data-service]

  - id: finance-service
    name: 'Finance Service'
    domain: finance
    description: 'Chart of accounts, journal entries, GL, AP/AR, banking.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: tenant_<slug>_finance)
    port: 8093
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['JournalPosted', 'PaymentReceived']
    events-consumed: ['InvoiceCreated', 'InvoicePaid', 'PayrollProcessed']
    dependencies: [master-data-service]

  - id: marketing-service
    name: 'Marketing Service'
    domain: marketing
    description: 'Campaigns, leads, segments, analytics.'
    technology: 'Spring Boot 21'
    database: PostgreSQL (schema: tenant_<slug>_marketing)
    port: 8094
    api-prefix: '/client-api/v1, /service-api/v1'
    events-published: ['CampaignLaunched', 'LeadCaptured']
    events-consumed: ['CustomerCreated']
    dependencies: []

  # ===== FRONTEND =====
  - id: web-shell
    name: 'Web Shell (Frontend host)'
    domain: frontend
    type: frontend-app
    description: 'ReactJS host shell. Load mini-apps + auth flow.'
    technology: 'ReactJS 18 + Vite + Module Federation'
    port: 5173
    dependencies: [keycloak, api-gateway]

# ===== SHARED LIBRARIES (Java, không phải service) =====
shared-libraries:
  - id: shared-common
    name: 'shared-common'
    description: 'Tenant util, audit event publisher (Kafka), file wrapper (S3/MinIO), util chung.'
    published-as: 'com.cachesol.platform:shared-common'

  - id: shared-messaging
    name: 'shared-messaging'
    description: 'Kafka producer/consumer base classes, event envelope, retry policy.'
    published-as: 'com.cachesol.platform:shared-messaging'

  - id: shared-security
    name: 'shared-security'
    description: 'Keycloak JWT decoder (JWK), TenantContextFilter, @PreAuthorize với user_app_roles.'
    published-as: 'com.cachesol.platform:shared-security'

# ===== CÁC SERVICE ĐÃ GỘP/XOÁ (v2 → v3) =====
removed-services:
  - organization-service: '→ gộp vào hrm-service (organizations + job_titles)'
  - employee-service: '→ gộp vào hrm-service (employees + employee_assignments)'
  - customer-service: '→ gộp vào sales-service (customers)'
  - audit-service: '→ library audit publisher trong shared-common (Kafka topic audit.<tenant>.events)'
  - file-service: '→ library file wrapper trong shared-common (S3/MinIO)'
  - search-service: '→ xoá. Dùng PostgreSQL full-text + ltree trước.'
  - reporting-service: '→ xoá. Để trong từng application.'
  - scheduler-service: '→ xoá. Spring @Scheduled in-app.'
  - integration-service: '→ xoá. 3rd-party connector trong từng application.'
