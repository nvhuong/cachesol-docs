spring:
  application:
    name: tenant-manager-service
  port: 8083
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cachesol_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
  kafka:
    bootstrap-servers: ${SPRING_KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 10000

server:
  port: 8083
  forward-headers-strategy: framework

jpa:
  open-in-view: false
  hibernate:
    ddl-auto: none            # Flyway owns schema
  properties:
    hibernate:
      default_schema: tenant_manager

flyway:
  enabled: true
  schemas: tenant_manager
  default-schema: tenant_manager
  baseline-on-migrate: true

info:
  app:
    name: "Tenant Manager"
    description: "Users, roles, organizations, employees"
    version: "1.0.0"

logging:
  level:
    root: INFO
    com.cachesol: DEBUG
