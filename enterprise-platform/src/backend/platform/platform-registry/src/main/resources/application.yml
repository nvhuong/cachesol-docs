spring:
  application:
    name: platform-registry-service
  port: 8081
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cachesol_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # Bump max.block.ms đủ lớn để lần publish đầu (khi Kafka vừa auto-create topic)
      # không bị TimeoutException. Sau lần đầu, metadata cached → publish gần như tức thì.
      properties:
        max.block.ms: 5000
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
        retries: 2
        retry.backoff.ms: 200
        spring.json.add.type.headers: false

server:
  port: 8081
  forward-headers-strategy: framework

jpa:
  open-in-view: false
  hibernate:
    ddl-auto: none            # Flyway là owner

flyway:
  enabled: true
  schemas: public
  default-schema: public
  baseline-on-migrate: true
  baseline-version: 0
  validate-on-migrate: true

info:
  app:
    name: "Platform Registry"
    description: "Tenant catalog, mini-app registry"
    version: "1.0.0"

logging:
  level:
    root: INFO
    com.cachesol: DEBUG
    org.springframework.security: INFO
