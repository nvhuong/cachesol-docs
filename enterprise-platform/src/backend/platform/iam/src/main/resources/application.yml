spring:
  application:
    name: iam-service
  port: 8082

server:
  port: 8082
  forward-headers-strategy: framework

# IAM — Keycloak JWT verifier config
keycloak:
  server-url: ${KEYCLOAK_URL:http://keycloak:8080}
  realm: ${KEYCLOAK_REALM:master}
  default-realm: ${KEYCLOAK_REALM:master}
  admin-client-id: ${KEYCLOAK_ADMIN_CLIENT:admin-cli}
  admin-username: ${KEYCLOAK_ADMIN_USER:admin}
  admin-password: ${KEYCLOAK_ADMIN_PASSWORD:admin}

iam:
  jwks-cache-ttl: 3600000
  webhook:
    hmac-secret: ${KC_WEBHOOK_HMAC_SECRET:changeme-in-prod}
    forward-to-kafka-topic: keycloak.events
    max-retries: 3

info:
  app:
    name: "IAM Service"
    description: "JWT verify Keycloak + webhook forwarding"
    version: "1.0.0"

logging:
  level:
    root: INFO
    com.cachesol: DEBUG
    org.springframework.security: INFO
