{% extends "admin/base.html" %}{% block heading %}Sách{% endblock %}{% block content %}
<section class="panel"><h2>Thêm sách</h2><form method="post" class="grid"><select name="category_id" required><option value="">Chọn thể loại</option>{% for c in categories %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select><input name="title" placeholder="Tên sách" required><input name="author" placeholder="Tác giả"><input name="cover_url" placeholder="URL ảnh bìa"><textarea name="description" placeholder="Mô tả"></textarea><button>Thêm sách</button></form></section>
<section class="panel"><table><tr><th>Tên</th><th>Tác giả</th><th>Thể loại</th><th></th></tr>{% for x in books %}<tr><td><a href="/admin/chapters?book_id={{ x.id }}">{{ x.title }}</a></td><td>{{ x.author }}</td><td>{{ x.category.name }}</td><td><form method="post" action="/admin/books/{{ x.id }}/delete" onsubmit="return confirm('Xóa sách và các chương?')"><button class="danger">Xóa</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
