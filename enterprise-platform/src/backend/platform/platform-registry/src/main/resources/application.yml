spring:
  application:
    name: platform-registry-service
  port: 8081
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/cachesol_platform}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

server:
  port: 8081
  forward-headers-strategy: framework

jpa:
  open-in-view: false
  hibernate:
    ddl-auto: none            # Flyway là owner

flyway:
  enabled: true
  schemas: public
  default-schema: public
  baseline-on-migrate: true

info:
  app:
    name: "Platform Registry"
    description: "Tenant catalog, mini-app registry"
    version: "1.0.0"

logging:
  level:
    root: INFO
    com.cachesol: DEBUG
    org.springframework.security: INFO
