[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nghien-sach-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.5,<3",
  "python-multipart>=0.0.12,<1",
  "jinja2>=3.1,<4",
  "pypdf>=5,<7",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "reportlab>=4.2,<5",
  "itsdangerous>=2.2,<3",
]

[project.optional-dependencies]
tts = ["vieneu"]
postgres = ["psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "httpx>=0.27,<1", "ruff>=0.7,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
